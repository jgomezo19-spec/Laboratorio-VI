openapi: 3.0.3

info:
  title: API de Reservas
  description: API para gestionar reservas de hotel
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:

  /api/v1/reservas:
    post:
      summary: Crear una reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reserva'
      responses:
        '201':
          description: Reserva creada correctamente
        '400':
          description: Datos inválidos

    get:
      summary: Consultar todas las reservas
      responses:
        '200':
          description: Lista de reservas

  /api/v1/reservas/{id}:
    get:
      summary: Consultar reserva por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reserva encontrada
        '404':
          description: Reserva no encontrada

    put:
      summary: Actualizar una reserva
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reserva'
      responses:
        '200':
          description: Reserva actualizada correctamente
        '404':
          description: Reserva no encontrada

    delete:
      summary: Cancelar una reserva
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reserva cancelada correctamente
        '404':
          description: Reserva no encontrada

components:

  schemas:

    Reserva:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombreCliente:
          type: string
        habitacion:
          type: string
        fechaEntrada:
          type: string
          format: date
        fechaSalida:
          type: string
          format: date
        estado:
          type: string